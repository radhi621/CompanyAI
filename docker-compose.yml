name: companyai

services:
  mongo:
    image: mongo:8.0
    container_name: companyai-mongo
    restart: unless-stopped
    ports:
      # Host port is configurable via MONGO_PORT in a root .env file (defaults to 27017).
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
    name: companyai-mongo-data
