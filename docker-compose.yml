name: companyai

services:
  mongo:
    image: mongo:8.0
    container_name: companyai-mongo
    restart: unless-stopped
    ports:
      # Host port is configurable via MONGO_PORT in a root .env file (defaults to 27017).
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    # Vector database for RAG search. Matches the @qdrant/js-client-rest version in back-end.
    image: qdrant/qdrant:v1.17.0
    container_name: companyai-qdrant
    restart: unless-stopped
    ports:
      # Host port is configurable via QDRANT_PORT in a root .env file (defaults to 6333).
      # Bound to 127.0.0.1 only: the instance has no API key, so it must not be reachable from the network.
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  mongo-data:
    name: companyai-mongo-data
  qdrant-data:
    name: companyai-qdrant-data
